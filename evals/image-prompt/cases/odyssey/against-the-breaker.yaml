schema_version: 1
purpose: Replacement for the-rooted-bed, rejected by the user on 2026-10-20.
source: Generated by the eval rating page with ideas prompt v6, 2026-10-20
idea:
  id: against-the-breaker
  name: Against the Breaker
  composition: A single ancient sailing ship pitches steeply upward into a
    breaking wave, forming one connected transparent silhouette slightly below
    center in a full rectangular field of primary-color book text. The ship
    spans roughly two-thirds of the field’s width; its deep curved hull, raised
    prow, stout mast, and single wind-filled square sail create a bold,
    immediately readable outline. A broad transparent breaker joins the
    underside of the prow and sweeps beneath the hull, making the rough sea part
    of the main silhouette. Two sweeping transparent channels extend from this
    breaker into the surrounding text to convey the opposing surge. Broad areas
    of retained text separate sail, mast, and hull; one transparent channel
    describes the gunwale. All essential channels, connections, and gaps are at
    least about 1% of the canvas width. Use smooth vector curves and clean edges
    throughout, with no rigging, individual oars, spray, distant scenery, or
    accent color. Leave generous uninterrupted text above and beside the
    subject.
  literary_basis: "The Odyssey repeatedly turns the sea into an obstacle between
    Odysseus and home: Poseidon opposes his return, storms scatter his course,
    and ships offer only precarious protection. An ancient ship climbing an
    overwhelming breaker makes that struggle visible through the relationship
    between vessel and water. The composition evokes the voyage as a whole
    without claiming to illustrate one exact storm or borrowing an adaptation’s
    ship design."
  palette:
    - color: "#294C57"
      use: "Primary text ink: muted deep blue-green across the entire rectangular text
        field."
    - color: "#F3EBDD"
      use: Suggested warm ivory paper, visible through the ship silhouette, wave
        channels, and narrow transparent placement margin.
  conversion_resilience: The deep hull, large sail, and steep pitching angle
    remain recognizable when the ink field is rebuilt from small book
    characters. Broad text-filled separations preserve the ship’s structure,
    while the connected breaker and spacious wave channels communicate rough
    water without relying on fine lines or scattered details. The composition
    uses only solid ink and fully transparent openings.
