idea:
  id: beneath-the-cyclops-ram
  name: The Unseen Passenger
  composition: A single rectangular field of dark book text fills the interior,
    leaving a narrow transparent placement margin. Centered slightly below the
    midpoint, a large ram in side profile carries Odysseus concealed beneath its
    belly; their interlocking transparent silhouettes span roughly
    three-quarters of the field’s width. The ram’s lifted head, heavy chest,
    curled horn, and deliberately spaced legs establish the outer shape. Below,
    Odysseus faces backward, his bent arms gripping the fleece and his knees
    drawn toward his chest. Broad wedges of retained text separate his face,
    forearms, and folded legs from the animal, keeping their relationship
    readable. Bold transparent channels extending into these text areas
    articulate the horn’s curl, the ram’s jaw, and the bends of the man’s limbs.
    All essential gaps and channels are at least 1% of the canvas width. Use
    smooth contours, no individual wool curls, no scenery, and no accent
    element.
  literary_basis: "Odysseus escapes the blinded Polyphemus by clinging beneath a
    ram while the Cyclops feels the animals’ backs. The intertwined bodies make
    the poem’s resourcefulness physical: survival depends on concealment,
    endurance, and understanding an opponent’s limited perception. The reversed
    human posture rewards close inspection with the discovery of the hidden
    passenger."
  palette:
    - color: "#394A47"
      use: "Primary text ink: muted deep green with strong silhouette contrast."
    - color: "#F4EEDF"
      use: Suggested warm ivory paper, visible through every transparent cutout and
        channel.
  conversion_resilience: The ram’s substantial body, curled horn, and separated
    legs establish an immediate animal silhouette. Odysseus adds a second,
    discoverable reading through large anatomical shapes rather than tiny
    details. Broad text-filled separations preserve both bodies when the field
    is rebuilt from small book characters.
