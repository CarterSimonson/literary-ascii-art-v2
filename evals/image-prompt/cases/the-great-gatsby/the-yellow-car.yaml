schema_version: 1
purpose: Replacement for the-foxtrot-illusion, rejected by the user on 2026-10-20.
source: Generated by the eval rating page with ideas prompt v6, 2026-10-20
idea:
  id: the-yellow-car
  name: The Yellow Car
  composition: A single monumental open touring automobile appears in strict side
    profile across the lower-middle of one rectangular field of deep blue-green
    book text, surrounded by generous uninterrupted text and a narrow
    transparent placement margin. Its transparent silhouette reveals pale yellow
    paper, making the car itself yellow without an accent ink. An exaggerated
    long bonnet, upright windshield, open passenger compartment, broad running
    board, and two large wheel lobes give it an instantly recognizable
    luxury-car outline. Keep the wheels joined firmly to the body. Broad
    transparent channels extending into retained areas of text define the bonnet
    seam, door division, and running board. Use an original, simplified period
    design without model badges or adaptation-specific details. No occupants,
    road, buildings, or additional objects. All contours are smooth; every
    important channel and gap is at least about 1% of the canvas width. No
    title, author, logos, gradients, shading, texture, or decorative fragments.
  literary_basis: "Gatsby's conspicuous automobile makes his purchased identity
    tangible: Nick describes its rich cream color, while witnesses identify the
    vehicle involved in Myrtle Wilson's death as yellow. Daisy drives it during
    the fatal collision, and Gatsby's willingness to protect her connects the
    car directly to his devotion and the unequal consequences of wealth. Its
    immense, immaculate silhouette presents luxury with the ominous stillness of
    evidence."
  palette:
    - color: "#233E46"
      use: Primary ink for the continuous rectangular book-text field.
    - color: "#F1DEA0"
      use: Suggested pale yellow paper, visible through the transparent automobile and
        detail channels; no accent ink.
  conversion_resilience: The long bonnet, open cabin, upright windshield, and
    oversized wheels establish the automobile through large contour changes that
    survive reconstruction from small characters. Broad channels preserve its
    few structural divisions, while the pale yellow negative space keeps the
    central literary object immediately visible at thumbnail scale.
