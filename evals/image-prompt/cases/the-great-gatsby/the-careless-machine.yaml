idea:
  id: the-careless-machine
  name: The Careless Machine
  composition: One enormous open-top automobile cuts diagonally across the lower
    center of a single rectangular field of book text, with a narrow transparent
    placement margin and ample uninterrupted text above. Seen from an elevated
    front three-quarter view, its long hood, sweeping fenders, broad wheels, and
    empty cabin create a forceful, instantly readable transparent silhouette.
    The near fender looms toward the viewer while the rear tapers upward, giving
    the stationary object an unsettling sense of momentum. Use an original,
    simplified period automobile without badges or adaptation-specific styling.
    Substantial connected bridges of the text field articulate its construction;
    bold transparent channels describe the windshield, hood division, wheel
    arches, and broad grille openings. Every important bridge, channel, and gap
    is at least about 1% of the canvas width. No accent element. Use smooth
    vector contours, without shading, texture, tiny ornament, isolated
    fragments, scenery, lettering, or logos.
  literary_basis: Gatsby’s conspicuous automobile makes private wealth publicly
    visible, then becomes the vehicle Daisy drives when she kills Myrtle. Its
    monumental scale and conspicuously empty cabin connect extravagant display
    with the evasion of responsibility. The aggressive perspective turns a
    prized possession into an impersonal machine, grounding the design in the
    novel’s collision between aspiration, class privilege, and destructive
    carelessness.
  palette:
    - color: "#70562F"
      use: "Primary book-text ink: dark, muted brass brown, recalling conspicuous
        golden wealth while maintaining strong contrast."
    - color: "#F5F0E5"
      use: Optional suggested paper color, visible through the transparent automobile
        silhouette and detail channels.
  conversion_resilience: The long hood, open cabin, exaggerated front fenders, and
    broad wheel shapes establish the automobile before any internal detail is
    visible. Large continuous paper openings and substantial text bridges
    survive reconstruction from small book characters. The composition relies on
    its strong diagonal outline and a few generous structural divisions rather
    than spokes, chrome, upholstery, or other fragile details.
