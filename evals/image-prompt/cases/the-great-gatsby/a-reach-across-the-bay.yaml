idea:
  id: a-reach-across-the-bay
  name: A Reach Across the Bay
  composition: "A monumental transparent silhouette of Gatsby in side profile
    occupies the left-center of one rectangular primary-ink text field,
    extending to a narrow transparent placement margin. His body inclines
    slightly forward, with overlapping arms reaching toward a single muted-green
    disk on the right: the distant dock light, the only accent element. The
    figure spans roughly two-thirds of the field’s height; the space between
    fingertips and light makes his longing physically palpable. Simplified
    jacket contours and broad transparent channels at the shoulder and jacket
    opening articulate the gesture. Use smooth vector contours, an anonymous
    profile, and an invented, unadorned evening jacket. Generous uninterrupted
    text surrounds the figure; the pose supplies the movement and drama."
  literary_basis: Nick first observes Gatsby stretching his arms toward the green
    light at the end of Daisy’s dock. The reaching figure makes Gatsby’s desire
    active, while the conspicuous interval before the light embodies the
    distance between Daisy herself and the future he imagines through her. This
    recurring object connects romantic yearning with the novel’s larger concern
    with aspiration and the irretrievable past.
  palette:
    - color: "#253B4A"
      use: Primary book-text ink across the rectangular field.
    - color: "#58745E"
      use: Accent ink for the single dock-light disk.
    - color: "#F4EFE4"
      use: Suggested paper color, visible through the transparent figure and channels.
  conversion_resilience: The large profile, forward lean, and unified reaching-arm
    contour remain clear when the surrounding ink becomes small book characters.
    Keep every essential contour feature, transparent channel, and gap at least
    about 1% of the canvas width. Make the light a substantial flat disk with
    clear transparent separation from nearby text. Flat opaque inks, continuous
    smooth edges, and generous paper openings preserve the image without
    shading, texture, tiny facial details, or decorative fragments.
