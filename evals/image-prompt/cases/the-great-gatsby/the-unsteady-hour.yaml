idea:
  id: the-unsteady-hour
  name: The Unsteady Hour
  composition: One monumental mantel clock tilts slightly off balance in the lower
    center of a single rectangular field of primary-ink book text, leaving
    generous uninterrupted text above and beside it and a narrow transparent
    placement margin. Its transparent silhouette has a broad arched crown,
    straight shoulders, and two substantial feet, all formed with smooth vector
    contours. A large circular area of retained text defines the dial within the
    unprinted case; bold transparent channels describe its circumference and two
    simple hands. Every essential channel, gap, and narrow section measures at
    least about 1% of the canvas width. Use flat ink and transparent cutouts
    only, with no accent element, numerals, separate lettering, scenery,
    shading, or decoration.
  literary_basis: During Gatsby and Daisy’s reunion at Nick’s house, Gatsby nearly
    knocks over a defunct mantelpiece clock and catches it. Enlarging that
    precarious object turns a small physical embarrassment into an image of his
    attempt to recover their past. The slight tilt expresses instability without
    adding cracks or suggesting an invented destruction of the clock.
  palette:
    - color: "#293E49"
      use: Primary ink for the continuous book-text field.
    - color: "#F3EBDD"
      use: Suggested warm paper, visible through the clock silhouette and transparent
        channels.
  conversion_resilience: The arched case, broad feet, and oversized circular dial
    establish a recognizable clock through large, simple shapes. Wide
    transparent channels preserve the hands and dial boundary when the
    surrounding ink is rebuilt from small book characters; recognition does not
    depend on numerals or fine ornament.
