idea:
  id: the-foxtrot-illusion
  name: The Foxtrot Illusion
  composition: A glamorous, tightly grouped dancing couple forms one monumental
    transparent silhouette in the center of a single rectangular field of deep
    midnight-blue book text, bounded by a narrow transparent placement margin.
    Gatsby stands upright in a simplified evening suit; Daisy turns toward him,
    her head lifted and her long evening skirt sweeping outward in one confident
    curve. Their paired profiles, joined hands, and opposing shoulder lines
    establish an elegant fox-trot pose. The couple occupies roughly two-thirds
    of the field’s height, with generous uninterrupted text surrounding them. A
    broad wedge of text between their bodies preserves two distinct figures.
    Bold transparent channels through retained text areas suggest Gatsby’s lapel
    and two sweeping skirt folds. Every essential channel, opening, and
    connecting shape is at least 1% of the canvas width. Use smooth vector
    contours, without accessories, scenery, decorative fragments, shading, or
    texture. No accent element, title, author name, lettering, or logos.
  literary_basis: Daisy and Gatsby dance a fox-trot at his party, briefly making
    the extravagant entertainment feel like the private reunion he has staged it
    to achieve. Their poised closeness expresses the glamour of Gatsby’s world
    and his belief that wealth can restore an earlier love. The surrounding
    expanse of text isolates this apparently perfect moment, suggesting how
    fragile their intimacy remains within the larger social world. Invent the
    pose and clothing contours independently of adaptations.
  palette:
    - color: "#243747"
      use: Primary ink for the entire rectangular book-text field.
    - color: "#F3EBDD"
      use: Optional warm ivory paper, visible through the transparent couple,
        channels, and placement margin.
  conversion_resilience: The large joined silhouette reads first as an elegant
    dancing couple through its two heads, raised joined hands, upright torso,
    and sweeping skirt. Broad negative spaces separate the partners without
    relying on fingers, facial features, or costume ornament. Continuous
    contours and channels at least 1% of the canvas width remain clear when the
    surrounding ink is rebuilt from small book characters.
