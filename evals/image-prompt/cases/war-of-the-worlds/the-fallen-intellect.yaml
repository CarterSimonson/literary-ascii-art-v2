source: Generated by the eval rating page with ideas prompt v6, 2026-10-20
idea:
  id: the-fallen-intellect
  name: The Fallen Intellect
  composition: A single rectangle of muted aubergine text fills the interior up to
    a narrow transparent placement margin. One fallen Martian forms a crisp
    transparent silhouette on a steep diagonal, spanning roughly two thirds of
    the field’s height. Its immense rounded body hangs toward the upper right
    while its tentacles sweep down and left, folding back into a loose,
    unmistakably limp hook. Consolidate the overlapping tentacles into broad
    continuous groups; bold transparent channels opening into the surrounding
    text articulate their bends and separations. The contrast between the
    swollen body and the trailing limbs supplies the drama. Keep ample
    uninterrupted text around the figure. Use smooth vector contours, with every
    important channel and gap at least about 1% of the canvas width. No accent
    element, scenery, lettering, or additional objects.
  literary_basis: "Wells describes the Martians as predominantly enormous brains
    with rounded bodies and tactile tentacles. Their extraordinary intelligence
    and machinery ultimately fail against terrestrial microorganisms. A
    collapsed biological Martian makes that reversal physical: the invader’s
    formidable intellect becomes vulnerable flesh. The sweeping, lifeless pose
    centers the novel’s unsettling account of bodily dependence and ecological
    defeat."
  palette:
    - color: "#493844"
      use: Primary text ink throughout the rectangular field.
    - color: "#F2EBDD"
      use: Suggested warm paper, visible through the transparent creature and
        channels.
  conversion_resilience: The oversized rounded body and sweeping hooked tentacle
    mass create a strong contour recognizable before individual characters
    resolve. Broad separations keep the limbs distinct after text conversion,
    while the expression of collapse comes from the overall pose rather than
    fragile facial details. Continuous shapes and generous gaps avoid specks,
    isolated fragments, and dependence on shading.
